[package]
name = "crazy-reader"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts", "clipboard"] }
encoding_rs = "0.8.42"
hayro = "0.8.0"
image = "0.25.10"
lopdf = "0.46.0"
pulldown-cmark = "0.13.4"
quick-xml = { version = "0.42.0", default-features = false, features = ["escape-html", "encoding"] }
rfd = "0.17.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.154"
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }
